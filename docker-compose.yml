name: openclaw

x-openclaw-environment: &openclaw-environment
  HOME: /home/node
  OPENCLAW_HOME: /home/node

  OPENCLAW_STATE_DIR: /home/node/.openclaw
  OPENCLAW_CONFIG_DIR: /home/node/.openclaw
  OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
  OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace

  OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
  OPENCLAW_GATEWAY_BIND: ${OPENCLAW_GATEWAY_BIND:-lan}

  XAI_API_KEY: ${XAI_API_KEY:-}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}

  TZ: ${TZ:-Asia/Jakarta}
  OPENCLAW_TZ: ${OPENCLAW_TZ:-Asia/Jakarta}
  BROWSER: echo
  TERM: xterm-256color

x-openclaw-volumes: &openclaw-volumes
  - ${OPENCLAW_STATE_PATH:-./data/openclaw}:/home/node/.openclaw
  - ${OPENCLAW_AUTH_PATH:-./data/auth}:/home/node/.config/openclaw

services:
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    restart: unless-stopped
    init: true

    env_file:
      - .env

    environment:
      <<: *openclaw-environment

    volumes: *openclaw-volumes

    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    cap_drop:
      - NET_RAW
      - NET_ADMIN

    security_opt:
      - no-new-privileges:true

    command:
      - node
      - dist/index.js
      - gateway
      - --bind
      - ${OPENCLAW_GATEWAY_BIND:-lan}
      - --port
      - "18789"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >
          fetch('http://127.0.0.1:18789/healthz')
          .then(response => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}

    profiles:
      - tools

    init: true

    network_mode: "service:openclaw-gateway"

    env_file:
      - .env

    environment:
      <<: *openclaw-environment

    volumes: *openclaw-volumes

    cap_drop:
      - NET_RAW
      - NET_ADMIN

    security_opt:
      - no-new-privileges:true

    stdin_open: true
    tty: true

    entrypoint:
      - node
      - dist/index.js

    depends_on:
      openclaw-gateway:
        condition: service_started

  opencode-adapter:
    build:
      context: ./opencode-adapter

    restart: unless-stopped

    env_file:
      - .env.opencodeadapter

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "127.0.0.1:4091:4091"
